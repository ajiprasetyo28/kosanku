name: Development

on:
  pull_request:
      types:
          - opened
          - edited
          - syncronize
          - reopened
  workflow_call:

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v2

      - name: "Setup node"
        uses: actions/setup-node@v2-1-5
        with:
          node-version: 16

      - name: "Install npm@latest"
        uses: npm i -g npm@latest

      - name: "Install dependencies"
        uses: bahmutov/npm-install@v1

      - name: "run tests"
        uses: npm run test --if-present
  lint:
    name: Code standards
    runs-on: ubntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v2

      - name: "Setup node"
        uses: actions/setup-node@v2.1.5
        with:
          node-version: 16
        
      - name: "Install npm@latest"
        uses: npm i -g npm@latest
      
      - name: "Install dependencies"
        uses: bahmutov/npm-install@v1

      - name: "Lint code"
        run: npm run lint --if-present
