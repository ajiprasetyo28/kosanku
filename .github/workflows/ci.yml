name: React Native CI

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build & Test React Native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Tests
        run: npm run test

      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: Remove Preinstalled Android SDK
        run: |
          sudo rm -rf $ANDROID_HOME
          sudo rm -rf /usr/local/lib/android/sdk

      - name: Install Correct Android SDK & Command-line Tools
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          sudo curl -o sdk-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip sdk-tools.zip -d $ANDROID_HOME/cmdline-tools
          sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm sdk-tools.zip

      - name: Fix Android SDK Permissions
        run: sudo chmod -R 777 $ANDROID_HOME

      - name: Manually Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -n "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -n "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Install Required Android SDK Packages
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;27.1.12297006"

      - name: Verify SDK Installation
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager --list

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
